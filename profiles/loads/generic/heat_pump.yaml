# A heat pump added by hand. Every measurement is optional; from two of electrical power,
# heat output and COP Sunflow computes the third. Optionally steered: SG-Ready (two relays,
# contact 2 only or a select), a raised setpoint, the PV surplus as a number or a boost switch;
# its built-in heating rod blocked, left free or released through the heat pump's integration.
# Only the roles of the chosen method are bound; the others are left out of the steps.
profile: generic/heat_pump
version: 1
match:
  integration: manual

capabilities: [appliance, heat_pump]

roles:
  power: {key: manual_power, unit: W, optional: true}
  power_l1: {key: manual_power_l1, unit: W, optional: true}
  power_l2: {key: manual_power_l2, unit: W, optional: true}
  power_l3: {key: manual_power_l3, unit: W, optional: true}
  current_l1: {key: manual_current_l1, unit: A, optional: true}
  current_l2: {key: manual_current_l2, unit: A, optional: true}
  current_l3: {key: manual_current_l3, unit: A, optional: true}
  energy: {key: manual_energy, unit: Wh, optional: true}
  heat_power: {key: manual_heat_power, unit: W, optional: true}
  heat_energy: {key: manual_heat_energy, unit: Wh, optional: true}
  cop: {key: manual_cop, unit: "", optional: true}
  temperature: {key: manual_temperature, unit: "°C", optional: true}
  outside_temperature: {key: manual_outside_temperature, unit: "°C", optional: true}
  sg_contact1: {key: manual_sg_contact1, optional: true}
  sg_contact2: {key: manual_sg_contact2, optional: true}
  sg_select: {key: manual_sg_select, optional: true}
  setpoint: {key: manual_setpoint, unit: "°C", optional: true}
  surplus_power: {key: manual_surplus_power, unit: W, optional: true}
  boost_switch: {key: manual_boost_switch, optional: true}
  rod_allow: {key: manual_rod_allow, optional: true}
  rod_block: {key: manual_rod_block, optional: true}
  rod_select: {key: manual_rod_select, optional: true}
  rod_limit: {key: manual_rod_limit, optional: true}

parameters:
  voltage: {unit: V, default: 230, min: 100, max: 260}

# Sunflow sets the variables per state (normal, boost, block, forced) and method
heat_pump_control:
  - switch: {role: sg_contact1, state: "{{ sg_contact1 }}", optional: true, write: if_differs}
  - switch: {role: sg_contact2, state: "{{ sg_contact2 }}", optional: true, write: if_differs}
  - select: {role: sg_select, option: "{{ sg_option }}", optional: true, write: if_differs}
  - number: {role: setpoint, value: "{{ setpoint }}", optional: true, write: if_differs}
  - number: {role: surplus_power, value: "{{ surplus_w }}", optional: true, write: if_differs, tolerance: 100}
  - switch: {role: boost_switch, state: "{{ boost_switch }}", optional: true, write: if_differs}
  # The rod's settings are kept in the heat pump's flash memory: counted against the daily write limit
  - switch: {role: rod_allow, state: "{{ rod_allow }}", optional: true, write: if_differs, storage: eeprom}
  - switch: {role: rod_block, state: "{{ rod_block }}", optional: true, write: if_differs, storage: eeprom}
  - select: {role: rod_select, option: "{{ rod_option }}", optional: true, write: if_differs, storage: eeprom}
  - number: {role: rod_limit, value: "{{ rod_limit }}", optional: true, write: if_differs, storage: eeprom}
