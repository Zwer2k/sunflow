# evcc loadpoint via the evcc_intg custom integration (HACS, marq24).
# A loadpoint may be a wallbox or a heater (then the "vehicle" SoC is a temperature).
# Its consumption is part of the household load measured by the inverter; Sunflow
# subtracts it to forecast the base load separately.
profile: evcc_intg/loadpoint
version: 1
match:
  integration: evcc_intg
  # The integration names devices in the HA language
  model: ["Loadpoint*", "Ladepunkt*"]
  requires: [charge_power, mode]

name_strip: ["evcc - ", "Loadpoint ", "Ladepunkt ", " [evcc]"]

capabilities: [loadpoint]

roles:
  charge_power: {key: charge_power, unit: kW}
  mode: {key: mode}
  charging: {key: charging, optional: true}
  connected: {key: connected, optional: true}
  vehicle_soc: {key: vehicle_soc, optional: true}
  limit_soc: {key: effective_limit_soc, optional: true}
  plan_soc: {key: effective_plan_soc, optional: true}
  plan_time: {key: effective_plan_time, optional: true}

# A loadpoint is a "heater" when its vehicle SoC is a temperature, else a "vehicle"
parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0, kind: vehicle}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100, kind: vehicle}
  tank_l: {unit: L, min: 0, kind: heater}
  # Reheating per day (hot water used plus standby losses); default: tank cools by 10 K
  daily_energy_wh: {unit: Wh, min: 0, kind: heater}

# Sunflow decides when a loadpoint charges or heats; evcc keeps handling the charger
# (vehicle detection, phases, minimum current). "now" charges at full power, "pv" with
# the surplus, "off" stops.
# On hand back evcc returns to the mode it had before.
charge_control:
  remember: {key: mode}
  charge:
    - select: {key: mode, option: "now", write: if_differs}
  # Less than full power planned (PV surplus): evcc follows the surplus itself
  follow:
    - select: {key: mode, option: "pv", write: if_differs}
  stop:
    - select: {key: mode, option: "off", write: if_differs}
