# Huawei SUN2000 hybrid with LUNA2000 battery via the huawei_solar custom integration.
# Writing needs the installer login in the integration ("elevated permissions").
# Forced charge and discharge are actions of the battery sub-device ("Batteries") with a
# duration: the battery returns to its own mode when Sunflow stops renewing them. Holding
# sets the maximum discharging power to 0; that and the PV derating are kept in flash, so
# they are only written when they change.
# Signs (integration): storage_charge_discharge_power + = charge, power_meter_active_power + = export.
# Not verified on hardware yet.
profile: huawei_solar/sun2000_luna2000
version: 1
match:
  integration: huawei_solar
  has_battery: true
  requires: [storage_state_of_capacity, storage_maximum_discharging_power]

capabilities: [pv, battery, grid_meter, battery_control, curtail]
watchdog: command
fallback: auto

roles:
  battery_soc: {key: storage_state_of_capacity, unit: "%"}
  battery_power: {key: storage_charge_discharge_power, unit: W, sign: charge_positive}
  pv_power: {key: input_power, unit: W}
  ac_power: {key: active_power, unit: W}
  grid_power: {key: power_meter_active_power, unit: W, sign: export_positive, optional: true}
  pv_energy: {key: accumulated_yield_energy, unit: kWh, optional: true}
  grid_import_energy: {key: grid_accumulated_energy, unit: kWh, optional: true}
  grid_export_energy: {key: grid_exported_energy, unit: kWh, optional: true}
  battery_charge_energy: {key: storage_total_charge, unit: kWh, optional: true}
  battery_discharge_energy: {key: storage_total_discharge, unit: kWh, optional: true}
  pv1_voltage: {key: pv_01_voltage, unit: V, optional: true}
  pv1_current: {key: pv_01_current, unit: A, optional: true}
  pv2_voltage: {key: pv_02_voltage, unit: V, optional: true}
  pv2_current: {key: pv_02_current, unit: A, optional: true}

parameters:
  capacity_wh: {unit: Wh, derive: {sum_key: storage_rated_capacity}}
  min_soc: {unit: "%", default: 10, min: 0, max: 100}
  max_charge: {unit: W, derive: {sum_key: storage_maximum_charge_power}}
  max_discharge: {unit: W, derive: {sum_key: storage_maximum_discharge_power}}
  max_ac_power: {unit: W, derive: {sum_key: P_max}}
  efficiency_pct: {unit: "%", default: 93, min: 40, max: 100}
  inverter_efficiency_pct: {unit: "%", default: 97, min: 80, max: 100}

battery_control:
  auto:
    - service: {action: huawei_solar.stop_forcible_charge, data: {device_id: "{{ device_id_batteries }}"}}
    - number: {key: storage_maximum_discharging_power, value: "{{ max_discharge }}", storage: eeprom, write: if_differs, tolerance: 50}
  hold:
    - service: {action: huawei_solar.stop_forcible_charge, data: {device_id: "{{ device_id_batteries }}"}}
    - number: {key: storage_maximum_discharging_power, value: 0, storage: eeprom, write: if_differs}
  force_charge:
    - number: {key: storage_maximum_discharging_power, value: "{{ max_discharge }}", storage: eeprom, write: if_differs, tolerance: 50}
    - service: {action: huawei_solar.forcible_charge, data: {device_id: "{{ device_id_batteries }}", duration: 30, power: "{{ P }}"}}
  force_discharge:
    - number: {key: storage_maximum_discharging_power, value: "{{ max_discharge }}", storage: eeprom, write: if_differs, tolerance: 50}
    - service: {action: huawei_solar.forcible_discharge, data: {device_id: "{{ device_id_batteries }}", duration: 30, power: "{{ P }}"}}
  # The forced charge runs 30 minutes; renewed well before
  refresh: 10min

pv_limit:
  set:
    - number: {key: active_power_fixed_value_derating, value: "{{ limit_w }}", min: 0, storage: eeprom, write: if_differs, tolerance: 300}
  release:
    - number: {key: active_power_fixed_value_derating, value: "{{ max_ac_power }}", storage: eeprom, write: if_differs, tolerance: 50}

eeprom_guard:
  max_writes_per_day: 30
