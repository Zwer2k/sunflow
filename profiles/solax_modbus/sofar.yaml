# Sofar hybrid inverters via the solax_modbus custom integration (Sofar plugin).
# Verified on hardware:
#   Passive mode registers: grid + = import, - = export; battery + = charge, - = discharge
#   Sensor active_power_pcc_total uses the opposite grid sign: - = import
#   The inverter clamps battery power to [bat_min, bat_max] and regulates the grid to grid_target.
#   Passive values live in inverter RAM (reset to 0/0/0 on inverter reboot -> battery idle).
#   Mode and other settings are stored in EEPROM.
profile: solax_modbus/sofar
version: 1
match:
  integration: solax_modbus
  requires: [charger_use_mode, passive_mode_battery_charge_discharge]

capabilities: [pv, pv_ext, battery, grid_meter, battery_window]
watchdog: none
fallback: auto

roles:
  battery_soc: {key: battery_capacity_total, unit: "%"}
  # The totals have 0.1 kW resolution, the values per input 0.01 kW (only connected
  # inputs are enabled); live values use their sum, statistics the total
  battery_power:
    key: battery_power_total
    unit: kW
    sign: charge_positive
    fine_keys: [battery_power_1, battery_power_2, battery_power_3, battery_power_4,
                battery_power_5, battery_power_6, battery_power_7, battery_power_8]
  pv_power: {key: pv_power_total, unit: kW, fine_keys: [pv_power_1, pv_power_2]}
  # Per MPPT string (DC), shown in the Live diagram
  pv1_power: {key: pv_power_1, unit: kW, optional: true}
  pv2_power: {key: pv_power_2, unit: kW, optional: true}
  pv_ext_power: {key: active_power_pv_ext, unit: kW}
  grid_power: {key: active_power_pcc_total, unit: kW, sign: export_positive}
  load_power: {key: active_power_load_sys, unit: kW}
  # AC output of the inverter (+ = feeding the house); preferred for the balance check
  inverter_power: {key: active_power_output_total, unit: kW, optional: true}
  # Energy counters: exact balance, autarky and battery efficiency (PV is counted on the DC side)
  pv_energy: {key: solar_generation_total, unit: kWh, optional: true}
  load_energy: {key: load_consumption_total, unit: kWh, optional: true}
  grid_import_energy: {key: import_energy_total, unit: kWh, optional: true}
  grid_export_energy: {key: export_energy_total, unit: kWh, optional: true}
  battery_charge_energy: {key: battery_input_energy_total, unit: kWh, optional: true}
  battery_discharge_energy: {key: battery_output_energy_total, unit: kWh, optional: true}

# Mode in which the primitive takes effect; switching it is an EEPROM write
control_mode: {key: charger_use_mode, option: "Passive Mode"}

primitive:
  battery_window:
    params: {bat_min: W, bat_max: W, grid_target: W}
    storage: volatile
    refresh: 60s
    steps:
      - number: {key: passive_mode_grid_power, value: "{{ grid_target }}"}
      - number: {key: passive_mode_battery_power_min, value: "{{ bat_min }}"}
      - number: {key: passive_mode_battery_power_max, value: "{{ bat_max }}"}
      - press: {key: passive_mode_battery_charge_discharge}

parameters:
  # 4x BTS 5K: full charge capacity per module in Ah x 51.2 V nominal (16 LFP cells)
  capacity_wh: {unit: Wh, derive: {sum_key: pack_full_charge_capacity, factor: 51.2}}
  min_soc: {unit: "%", default: 10, min: 0, max: 100}
  max_charge: {unit: W, default: 20000, min: 0}
  max_discharge: {unit: W, default: 20000, min: 0}
  grid_offset: {unit: W, default: -200, advanced: true}
  # Battery round trip at its terminals (cells and DC/DC converters), as the battery
  # energy counters measure it; split evenly between both directions
  efficiency_pct: {unit: "%", default: 93, min: 40, max: 100}
  # AC/DC conversion of the inverter, per direction: grid charging and discharging to
  # the house pass it, PV charging on the DC side does not
  inverter_efficiency_pct: {unit: "%", default: 96.5, min: 80, max: 100}

actions:
  auto: {bat_min: -max_discharge, bat_max: max_charge, grid_target: grid_offset}
  hold: {bat_min: 0, bat_max: max_charge, grid_target: grid_offset}
  force_charge: {bat_min: P, bat_max: max_charge, grid_target: grid_offset}
  force_discharge: {bat_min: -max_discharge, bat_max: -P, grid_target: grid_offset}
  limit_charge: {bat_min: -max_discharge, bat_max: P, grid_target: grid_offset}
  limit_discharge: {bat_min: -P, bat_max: max_charge, grid_target: grid_offset}
  absorb: {bat_min: 0, bat_max: max_charge, grid_target: 0}

setup:
  - select: {key: passive_mode_timeout, option: "Disabled"}
  - press: {key: passive_mode_update_timeout, storage: eeprom, write: if_differs, readback: passive_mode_timeout}
  - select: {key: charger_use_mode, option: "Passive Mode", storage: eeprom, write: if_differs}

eeprom_guard:
  max_writes_per_day: 10
