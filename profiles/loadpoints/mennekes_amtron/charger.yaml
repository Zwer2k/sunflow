# Mennekes AMTRON 4You / 4Business via the mennekes_amtron custom integration (HACS, nobelp;
# Modbus TCP and REST). Unique ids look like "<entry id>_<key>". The current is the HEMS
# current limit (register 2000, kept in RAM), 0 A stops. If the box hears no new HEMS value
# within its communication timeout it falls back to its safe current: set that timeout to
# 300 s (Sunflow writes the current again at least every 5 minutes). The box takes only one
# Modbus client: not together with evcc.
# Not verified on hardware yet.
profile: mennekes_amtron/charger
version: 1
match:
  integration: mennekes_amtron
  requires: [hems_current_limit, vehicle_state]

capabilities: [loadpoint]

roles:
  charge_power: {key: total_power, unit: W}
  connected: {key: vehicle_state, on_states: [b_connected, c_charging, d_charging_ventilation]}
  charged_energy: {key: session_energy, unit: kWh, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - number: {key: hems_current_limit, value: "{{ current_a }}", write: if_differs}
  stop:
    - number: {key: hems_current_limit, value: 0, write: if_differs}
  # No HEMS limit: the box's own maximum
  release:
    - number: {key: hems_current_limit, value: 32, write: if_differs}
