# KEBA KeContact P30 / P40 via the keba custom integration (HACS, dannerph; local UDP). It
# replaces the core integration of the same domain, which is set up in YAML only.
# Unique ids look like "keba-<device id>-<key>", keys may contain spaces. The current is set
# with the action keba.set_current, a temporary current (currtime), not the stored user
# current. Charging is enabled and disabled with keba.start / keba.stop. Phase switching
# (X2 models) is left out: the library ignores switches within 5 minutes.
# Not verified on hardware yet.
profile: keba/charger
version: 1
match:
  integration: keba
  requires: [Plug_EV, Curr HW]

capabilities: [loadpoint]

roles:
  charge_power: {key: P, unit: kW}
  connected: {key: Plug_EV, domain: binary_sensor}
  charged_energy: {key: E pres, unit: kWh, optional: true}
  stored_current: {key: Curr user, unit: A, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0, derive: {sum_key: Curr HW, factor: 690}}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 63}
  max_current_a: {unit: A, default: 16, min: 6, max: 63, derive: {sum_key: Curr HW}}

charge_control:
  charge:
    - service: {action: keba.set_current, data: {device_id: "{{ device_id }}", current: "{{ current_a }}"}}
    - service: {action: keba.start, data: {device_id: "{{ device_id }}"}}
  stop:
    - service: {action: keba.stop, data: {device_id: "{{ device_id }}"}}
  # The stored user current applies again
  release:
    - service: {action: keba.set_current, data: {device_id: "{{ device_id }}", current: "{{ role_stored_current }}"}}
    - service: {action: keba.start, data: {device_id: "{{ device_id }}"}}
