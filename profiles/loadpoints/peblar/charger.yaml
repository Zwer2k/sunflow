# Peblar Home / Business via the peblar core integration (local REST, platinum).
# Unique ids look like "<serial>_<key>". The current is the charge current limit: Peblar
# keeps it only until changed, values below 6 A stop charging. The switch "charge" sets the
# limit to 0 and back to its last value. Single phase is forced with a switch the integration
# only offers when the installation allows it.
# Not verified on hardware yet.
profile: peblar/charger
version: 1
match:
  integration: peblar
  requires: [charge_current_limit, cp_state]

capabilities: [loadpoint]

roles:
  charge_power: {key: power_total, unit: W}
  # no_ev_connected, error, fault, invalid: not plugged in
  connected: {key: cp_state, on_states: [charging, suspended]}
  charged_energy: {key: energy_session, unit: Wh, optional: true}
  stored_current: {key: charge_current_limit, domain: number, unit: A, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3, advanced: true}
  phase_mode: {unit: "", default: 0, min: 0, max: 3}
  phase_up_w: {unit: W, default: 4500, min: 1500, max: 22000}
  phase_down_w: {unit: W, default: 4000, min: 1000, max: 22000}
  phase_up_delay_min: {unit: min, default: 5, min: 1, max: 60, advanced: true}
  phase_down_delay_min: {unit: min, default: 2, min: 1, max: 60, advanced: true}
  phase_min_interval_min: {unit: min, default: 15, min: 5, max: 240, advanced: true}
  phase_max_switches_day: {unit: "", default: 12, min: 1, max: 100, advanced: true}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - number: {key: charge_current_limit, value: "{{ current_a }}", write: if_differs}
    - switch: {key: charge, state: "on", write: if_differs}
  stop:
    - switch: {key: charge, state: "off", write: if_differs}
  release:
    - switch: {key: charge, state: "on", write: if_differs}
  remember: {key: charge_current_limit, domain: number}

# Kept by the charger: only on change
phase_switch:
  one:
    - switch: {key: force_single_phase, state: "on", storage: eeprom, write: if_differs}
  three:
    - switch: {key: force_single_phase, state: "off", storage: eeprom, write: if_differs}

eeprom_guard:
  max_writes_per_day: 20
