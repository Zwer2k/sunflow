# Webasto Unite, Ampure Unite and Vestel EVC04 via the unite_ev_charger custom integration
# (HACS, Dextro86; Modbus). The integration's control mode must be "external", otherwise its
# own fast/solar regulation runs. Unique ids look like "<serial>_<key>". The current
# (register 5004) is kept in RAM, 0 A stops; the integration writes the alive register, the box
# falls back to its failsafe current 30 s after Home Assistant stops. After a phase switch the
# box takes no writes for 15–20 s; some cars refuse 1 → 3 while charging.
# Not verified on hardware yet.
profile: unite_ev_charger/charger
version: 1
match:
  integration: unite_ev_charger
  requires: [charge_current, charging_enabled]

capabilities: [loadpoint]

roles:
  charge_power: {key: active_power, unit: W}
  connected: {key: vehicle_connected, domain: binary_sensor}
  charged_energy: {key: session_energy, unit: kWh, optional: true}
  allowed_current: {key: set_current, domain: sensor, unit: A, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3, advanced: true}
  phase_mode: {unit: "", default: 0, min: 0, max: 3}
  phase_up_w: {unit: W, default: 4500, min: 1500, max: 22000}
  phase_down_w: {unit: W, default: 4000, min: 1000, max: 22000}
  phase_up_delay_min: {unit: min, default: 5, min: 1, max: 60, advanced: true}
  phase_down_delay_min: {unit: min, default: 2, min: 1, max: 60, advanced: true}
  phase_min_interval_min: {unit: min, default: 15, min: 5, max: 240, advanced: true}
  phase_max_switches_day: {unit: "", default: 12, min: 1, max: 100, advanced: true}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - number: {key: charge_current, value: "{{ current_a }}", write: if_differs}
    - switch: {key: charging_enabled, state: "on", write: if_differs}
  stop:
    - switch: {key: charging_enabled, state: "off", write: if_differs}
  release:
    - number: {key: charge_current, value: "{{ max_current_a }}", write: if_differs}
    - switch: {key: charging_enabled, state: "on", write: if_differs}

# Register 405, set again by the integration after unplugging
phase_switch:
  one:
    - select: {key: phase_select, option: "1", write: if_differs}
  three:
    - select: {key: phase_select, option: "3", write: if_differs}
