# V2C Trydan via the v2c core integration (local). Unique ids look like "<entry id>_<key>".
# The current is the number intensity (min_intensity and max_intensity are the charger's
# limits; the shortest unique id wins). The switch paused pauses when on. Sunflow must be the
# only regulation: switch off the charger's dynamic (PV) mode.
# Not verified on hardware yet.
profile: v2c/charger
version: 1
match:
  integration: v2c
  requires: [intensity, paused]

capabilities: [loadpoint]

roles:
  charge_power: {key: charge_power, unit: W}
  connected: {key: connected, domain: binary_sensor}
  charged_energy: {key: charge_energy, unit: kWh, optional: true}
  stored_current: {key: intensity, domain: number, unit: A, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 7400, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 1, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 32, min: 6, max: 32}

charge_control:
  charge:
    - number: {key: intensity, value: "{{ current_a }}", write: if_differs}
    - switch: {key: paused, state: "off", write: if_differs}
  stop:
    - switch: {key: paused, state: "on", write: if_differs}
  release:
    - switch: {key: paused, state: "off", write: if_differs}
  remember: {key: intensity, domain: number}
