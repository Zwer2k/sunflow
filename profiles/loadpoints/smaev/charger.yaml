# SMA EV Charger via the smaev custom integration (HACS, alengwenus; local HTTPS). Unique ids
# look like "<serial>-<key>". The current limit is a device parameter the charger keeps
# (disabled by default in Home Assistant, Sunflow enables it): changed at most every 5 minutes.
# The charge session mode starts and stops; "optimized_charging" is the charger's own logic.
# Not verified on hardware yet.
profile: smaev/charger
version: 1
match:
  integration: smaev
  requires: [charge_current_limit, operating_mode_of_charge_session]

capabilities: [loadpoint]

roles:
  charge_power: {key: charging_station_power, unit: W}
  connected: {key: charging_session_status, on_states: [sleep_mode, active_mode]}
  charged_energy: {key: charging_session_energy, unit: Wh, optional: true}
  stored_current: {key: charge_current_limit, domain: number, unit: A, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 22000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 32, min: 6, max: 32}
  # Kept by the charger: not more often than this
  current_interval_min: {unit: min, default: 5, min: 3, max: 60, advanced: true}

charge_control:
  charge:
    - number: {key: charge_current_limit, value: "{{ current_a }}", write: if_differs}
    - select: {key: operating_mode_of_charge_session, option: boost_charging, write: if_differs}
  stop:
    - select: {key: operating_mode_of_charge_session, option: charge_stop, write: if_differs}
  release:
    - select: {key: operating_mode_of_charge_session, option: optimized_charging, write: if_differs}
  remember: {key: charge_current_limit, domain: number}
