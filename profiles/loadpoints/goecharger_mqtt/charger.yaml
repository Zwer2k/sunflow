# go-e Charger (Gemini, HOME) via the goecharger_mqtt custom integration (HACS).
# Sunflow controls the charger directly; evcc must not control the same charger then.
# Unique ids look like "216505-select-frc-frc", so keys include the platform.
# The current is set as "amx" over MQTT: a temporary current that is not stored in
# the charger's flash (like evcc does), so it may follow the PV surplus every minute.
# The integration has no entity for it; the topic is "go-eCharger/<serial>" (the
# integration's default). Charging is started and stopped with the force state.
profile: goecharger_mqtt/charger
version: 2
match:
  integration: goecharger_mqtt
  model: ["go-eCharger*", "go-e Charger*"]
  requires: [select-frc-frc, number-amp-0]

capabilities: [loadpoint]

roles:
  charge_power: {key: sensor-nrg-11, unit: W}
  connected: {key: binary_sensor-car-1}
  charged_energy: {key: sensor-wh-0, unit: Wh, optional: true}
  # Current stored in flash; it applies again when Sunflow hands the charger back
  stored_current: {key: number-amp-0, unit: A, optional: true}
  # RFID: the scanned card ("card_0" = card 1) and whether one is required to charge
  transaction: {key: select-trx-trx, optional: true}
  card_required: {key: switch-acs-0, optional: true}
  # Phase switch mode: one_phase / three_phases (auto: the charger's own switching)
  phase_mode: {key: select-psm-psm, optional: true}
  # The charger does not know the vehicle's SoC: bind a sensor of the car's integration
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  # Phases of the connection when the charger does not switch them
  phases: {unit: "", default: 3, min: 1, max: 3, advanced: true}
  # Phase switching: 0 automatic (Sunflow switches), 1 or 3 always
  phase_mode: {unit: "", default: 0, min: 0, max: 3}
  phase_up_w: {unit: W, default: 4500, min: 1500, max: 22000}
  phase_down_w: {unit: W, default: 4000, min: 1000, max: 22000}
  phase_up_delay_min: {unit: min, default: 5, min: 0, max: 60, advanced: true}
  phase_down_delay_min: {unit: min, default: 2, min: 0, max: 60, advanced: true}
  phase_min_interval_min: {unit: min, default: 15, min: 0, max: 240, advanced: true}
  phase_max_switches_day: {unit: "", default: 12, min: 0, max: 100, advanced: true}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - service: {action: mqtt.publish, data: {topic: "go-eCharger/{{ device_serial }}/amx/set", payload: "{{ current_a }}"}, storage: volatile}
    - select: {key: select-frc-frc, option: "charge", write: if_differs}
  stop:
    - select: {key: select-frc-frc, option: "dont_charge", write: if_differs}
  # Start the transaction for a vehicle recognized without its card (if allowed)
  authorize:
    - select: {key: select-trx-trx, option: "{{ transaction }}"}
  # The charger's own logic again (charges when plugged in, unless its schedule says otherwise)
  release:
    - service: {action: mqtt.publish, data: {topic: "go-eCharger/{{ device_serial }}/amx/set", payload: "{{ role_stored_current }}"}, storage: volatile}
    - select: {key: select-frc-frc, option: "neutral", write: if_differs}

# The phase switch mode is a setting of the charger (kept in flash): only on change
phase_switch:
  remember: {key: select-psm-psm}
  one:
    - select: {key: select-psm-psm, option: "one_phase", storage: eeprom, write: if_differs}
  three:
    - select: {key: select-psm-psm, option: "three_phases", storage: eeprom, write: if_differs}

eeprom_guard:
  max_writes_per_day: 20
