# Easee Home / Charge via the easee custom integration (HACS, nordicopen; Easee cloud).
# Unique ids look like "<serial>_<key>"; the actions take the serial as charger_id. The current
# is the dynamic charger limit, a temporary limit for load management (the charger's own
# maximum stays). Every write is a cloud call: changed at most every 5 minutes. The phase mode
# is a setting in the cloud, written only on change.
# Not verified on hardware yet.
profile: easee/charger
version: 1
match:
  integration: easee
  requires: [status, dynamic_charger_limit]

capabilities: [loadpoint]

roles:
  charge_power: {key: power, unit: kW}
  connected:
    key: status
    domain: sensor
    on_states: [awaiting_start, charging, completed, ready_to_charge, awaiting_authorization, awaiting_smart_start, awaiting_load_balancing]
  charged_energy: {key: session_energy, unit: kWh, optional: true}
  allowed_current: {key: dynamic_charger_limit, unit: A, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0, derive: {sum_key: max_charger_limit, factor: 690}}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3, advanced: true}
  phase_mode: {unit: "", default: 0, min: 0, max: 3}
  phase_up_w: {unit: W, default: 4500, min: 1500, max: 22000}
  phase_down_w: {unit: W, default: 4000, min: 1000, max: 22000}
  phase_up_delay_min: {unit: min, default: 10, min: 1, max: 60, advanced: true}
  phase_down_delay_min: {unit: min, default: 5, min: 1, max: 60, advanced: true}
  phase_min_interval_min: {unit: min, default: 30, min: 5, max: 240, advanced: true}
  phase_max_switches_day: {unit: "", default: 8, min: 1, max: 100, advanced: true}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32, derive: {sum_key: max_charger_limit}}
  # Cloud calls: not more often than this
  current_interval_min: {unit: min, default: 5, min: 5, max: 60, advanced: true}

charge_control:
  charge:
    - service: {action: easee.set_charger_dynamic_limit, data: {charger_id: "{{ device_serial }}", current: "{{ current_a }}"}}
    - service: {action: easee.action_command, data: {charger_id: "{{ device_serial }}", action_command: resume}}
  stop:
    - service: {action: easee.action_command, data: {charger_id: "{{ device_serial }}", action_command: pause}}
  # Load management lifted: the charger's own maximum
  release:
    - service: {action: easee.set_charger_dynamic_limit, data: {charger_id: "{{ device_serial }}", current: "{{ max_current_a }}"}}
    - service: {action: easee.action_command, data: {charger_id: "{{ device_serial }}", action_command: resume}}

phase_switch:
  one:
    - service: {action: easee.set_charger_phase_mode, data: {charger_id: "{{ device_serial }}", phase_mode: 1_phase}, storage: eeprom}
  three:
    - service: {action: easee.set_charger_phase_mode, data: {charger_id: "{{ device_serial }}", phase_mode: 3_phase}, storage: eeprom}

eeprom_guard:
  max_writes_per_day: 10
