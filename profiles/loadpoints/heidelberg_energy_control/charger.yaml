# Heidelberg Energy Control (and Amperfied connect) via the heidelberg_energy_control custom
# integration (HACS, Schrolli91; Modbus through an RTU gateway). Unique ids look like
# "<entry id>_<key>". The current is the virtual current (register 261, kept in RAM); it reaches
# the box only while the switch virtual_enable is on, off writes 0 A. Switch off the box's
# standby. Without Modbus traffic for the watchdog timeout the box falls back to its failsafe
# current; the integration's poll keeps it alive.
# Not verified on hardware yet.
profile: heidelberg_energy_control/charger
version: 1
match:
  integration: heidelberg_energy_control
  requires: [virtual_current, virtual_enable]

capabilities: [loadpoint]

roles:
  charge_power: {key: charging_power, unit: W}
  connected: {key: is_plugged, domain: binary_sensor}
  charging: {key: is_charging, domain: binary_sensor, optional: true}
  charged_energy: {key: session_energy, unit: kWh, optional: true}
  stored_current: {key: virtual_current, domain: number, unit: A, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0, derive: {sum_key: hw_max_current, factor: 690}}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 16}
  max_current_a: {unit: A, default: 16, min: 6, max: 16, derive: {sum_key: hw_max_current}}

charge_control:
  charge:
    - number: {key: virtual_current, value: "{{ current_a }}", write: if_differs}
    - switch: {key: virtual_enable, state: "on", write: if_differs}
  stop:
    - switch: {key: virtual_enable, state: "off", write: if_differs}
  # Charging at the box's maximum, as without an energy manager
  release:
    - number: {key: virtual_current, value: "{{ max_current_a }}", write: if_differs}
    - switch: {key: virtual_enable, state: "on", write: if_differs}
