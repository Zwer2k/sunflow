# Wallboxes with a Phoenix Contact EV-CC-AC1-M3-…-ETH controller directly over Modbus TCP
# (unit 255): Wallbe Eco / Eco 2.0 / Pro, ESL Walli, E3/DC Easy Connect, Compleo Pro. DIP
# switch 10 must be on. Registers as evcc reads them; 32-bit values have the low word first.
# The status is an ASCII letter (IEC 61851 A-F) in the low byte. Charging is enabled with coil
# 400, the current in whole A (extended Wallbe firmware uses 0.1 A and is not covered).
# Not verified on hardware yet.
profile: modbus/phoenix_ev_eth
version: 1

connection:
  type: modbus_tcp
  port: 502
  unit_id: 255
  word_order: little
  manufacturer: Phoenix Contact
  model: EV-CC-AC1-M3 ETH
  points:
    status: {address: 100, type: input, encoding: uint16, mask: 255, states: {65: A, 66: B, 67: C, 68: D, 69: E, 70: F}}
    power: {address: 120, type: input, encoding: int32, unit: W, device_class: power}
    energy: {address: 904, encoding: uint32, unit: Wh, device_class: energy}

capabilities: [loadpoint]

roles:
  charge_power: {key: power, unit: W}
  connected: {key: status, on_states: [B, C, D]}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - modbus: {address: 528, value: "{{ current_a }}", write: if_differs}
    - modbus: {address: 400, type: coil, value: 1, write: if_differs}
  stop:
    - modbus: {address: 400, type: coil, value: 0, write: if_differs}
  release:
    - modbus: {address: 528, value: "{{ max_current_a }}", write: if_differs}
    - modbus: {address: 400, type: coil, value: 1, write: if_differs}
