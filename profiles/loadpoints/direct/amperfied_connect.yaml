# Amperfied connect.home / connect.solar (Heidelberg Energy Control family with Ethernet)
# directly over Modbus TCP. Registers as evcc reads them: status 2/3 idle, 4/5 plugged, 6/7
# charging, 10 standby. The current in 0.1 A (0 stops) is kept in RAM; standby is switched off
# (register 258 = 4) with the first charge. The poll keeps the watchdog (register 257, default
# 15 s) alive while Sunflow runs; afterwards the box falls back to its failsafe current.
# Phase switching (register 501) is left out.
# Not verified on hardware yet.
profile: modbus/amperfied_connect
version: 1

connection:
  type: modbus_tcp
  port: 502
  unit_id: 1
  manufacturer: Amperfied
  model: connect.home / connect.solar
  poll: 5s
  points:
    status: {address: 5, type: input, encoding: uint16, states: {2: A, 3: A, 4: B, 5: B, 6: C, 7: C, 10: A}}
    power: {address: 14, type: input, encoding: uint16, unit: W, device_class: power}
    energy: {address: 17, type: input, encoding: uint32, unit: Wh, device_class: energy}

capabilities: [loadpoint]

roles:
  charge_power: {key: power, unit: W}
  connected: {key: status, on_states: [B, C]}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - modbus: {address: 258, value: 4, write: if_differs}
    - modbus: {address: 261, scale: 0.1, value: "{{ current_a }}", write: if_differs}
  stop:
    - modbus: {address: 261, scale: 0.1, value: 0, write: if_differs}
  release:
    - modbus: {address: 261, scale: 0.1, value: "{{ max_current_a }}", write: if_differs}
