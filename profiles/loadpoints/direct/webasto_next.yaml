# Webasto Next / Ampure Unite (new generation) directly over Modbus TCP (unit 255). Registers
# as evcc reads them. Status 0 idle, 1 and 4 plugged, 3 charging, 7 error. The current in A
# (0 stops) is kept in RAM. The life bit (register 6000) must be written within the
# wallbox's communication timeout; the keepalive writes it every 5 s while Sunflow controls,
# afterwards the wallbox falls back to its failsafe current. No phase switching.
# Not verified on hardware yet.
profile: modbus/webasto_next
version: 1

connection:
  type: modbus_tcp
  port: 502
  unit_id: 255
  manufacturer: Webasto
  model: Next
  poll: 5s
  keepalive: {every: 5s, steps: [{address: 6000, value: 1}]}
  points:
    status: {address: 1000, encoding: uint16, states: {0: A, 1: B, 3: C, 4: B, 7: E}}
    power: {address: 1020, encoding: uint32, unit: W, device_class: power}
    energy: {address: 1036, encoding: uint32, unit: Wh, device_class: energy}

capabilities: [loadpoint]

roles:
  charge_power: {key: power, unit: W}
  connected: {key: status, on_states: [B, C]}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - modbus: {address: 5004, value: "{{ current_a }}", write: if_differs}
  stop:
    - modbus: {address: 5004, value: 0, write: if_differs}
  release:
    - modbus: {address: 5004, value: "{{ max_current_a }}", write: if_differs}
