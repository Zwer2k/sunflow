# Vestel EVC04 and its relabels (Webasto Unite, Ampure Unite, E.ON Drive vBox) directly over
# Modbus TCP (unit 255). Registers as evcc reads them. Plugged when the cable state is 2 or 3.
# The current in A (0 stops) is kept in RAM. The alive register (6000) must be written within
# the communication timeout; the keepalive writes it every 5 s while Sunflow controls. Phase
# switching (register 405) needs firmware 3.187 or newer; the wallbox resets it on unplugging.
# Not verified on hardware yet.
profile: modbus/vestel_evc04
version: 1

connection:
  type: modbus_tcp
  port: 502
  unit_id: 255
  manufacturer: Vestel
  model: EVC04
  poll: 5s
  keepalive: {every: 5s, steps: [{address: 6000, value: 1}]}
  points:
    cable_state: {address: 1004, type: input, encoding: uint16, states: {0: A, 1: A, 2: B, 3: B}}
    charging: {address: 1001, type: input, encoding: uint16}
    power: {address: 1020, type: input, encoding: uint32, unit: W, device_class: power}
    session_energy: {address: 1502, type: input, encoding: uint32, unit: Wh, device_class: energy}

capabilities: [loadpoint]

roles:
  charge_power: {key: power, unit: W}
  connected: {key: cable_state, on_states: [B]}
  charged_energy: {key: session_energy, unit: Wh, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3, advanced: true}
  phase_mode: {unit: "", default: 0, min: 0, max: 3}
  phase_up_w: {unit: W, default: 4500, min: 1500, max: 22000}
  phase_down_w: {unit: W, default: 4000, min: 1000, max: 22000}
  phase_up_delay_min: {unit: min, default: 5, min: 1, max: 60, advanced: true}
  phase_down_delay_min: {unit: min, default: 2, min: 1, max: 60, advanced: true}
  phase_min_interval_min: {unit: min, default: 15, min: 5, max: 240, advanced: true}
  phase_max_switches_day: {unit: "", default: 12, min: 1, max: 100, advanced: true}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - modbus: {address: 5004, value: "{{ current_a }}", write: if_differs}
  stop:
    - modbus: {address: 5004, value: 0, write: if_differs}
  release:
    - modbus: {address: 5004, value: "{{ max_current_a }}", write: if_differs}

phase_switch:
  one:
    - modbus: {address: 405, value: 0, write: if_differs}
  three:
    - modbus: {address: 405, value: 1, write: if_differs}
