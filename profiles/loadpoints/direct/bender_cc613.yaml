# Wallboxes with a Bender CC612/CC613 controller directly over Modbus TCP (unit 255): Mennekes
# AMTRON Professional / ChargeControl / 4You 500, Webasto Live, Garo GLB/LS4, Ensto, Juice,
# TechniSat, Ebee and others. Enable "Modbus TCP Server for energy management systems" in the
# web interface. Registers as evcc reads them. Control pilot state 1 idle, 2 plugged, 3/4
# charging. The current in A (0 pauses). Phase switching differs by model and is left out.
# Not verified on hardware yet.
profile: modbus/bender_cc613
version: 1

connection:
  type: modbus_tcp
  port: 502
  unit_id: 255
  manufacturer: Bender
  model: CC612 / CC613
  points:
    cp_state: {address: 122, encoding: uint16, states: {1: A, 2: B, 3: C, 4: C}}
    power: {address: 220, encoding: uint32, unit: W, device_class: power}
    energy: {address: 218, encoding: uint32, unit: Wh, device_class: energy}

capabilities: [loadpoint]

roles:
  charge_power: {key: power, unit: W}
  connected: {key: cp_state, on_states: [B, C]}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - modbus: {address: 1000, value: "{{ current_a }}", write: if_differs}
  stop:
    - modbus: {address: 1000, value: 0, write: if_differs}
  release:
    - modbus: {address: 1000, value: "{{ max_current_a }}", write: if_differs}
