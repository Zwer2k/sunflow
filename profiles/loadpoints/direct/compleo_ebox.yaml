# Compleo eBox Solo / Duo (also SENEC.Wallbox, Neoom) directly over Modbus TCP (unit 255),
# connector 1. Registers as evcc reads them. The wallbox takes a power limit in 100 W steps
# (Sunflow writes the planned power), 0 stops. Bit 0 of the status is plugged. The poll keeps
# the communication within the wallbox's fallback timeout.
# Not verified on hardware yet.
profile: modbus/compleo_ebox
version: 1

connection:
  type: modbus_tcp
  port: 502
  unit_id: 255
  manufacturer: Compleo
  model: eBox
  points:
    plugged: {address: 257, type: input, encoding: uint16, mask: 1, states: {0: "off", 1: "on"}}
    power: {address: 258, type: input, encoding: uint16, scale: 100, unit: W, device_class: power}
    session_energy: {address: 264, type: input, encoding: uint16, scale: 100, unit: Wh, device_class: energy}

capabilities: [loadpoint]

roles:
  charge_power: {key: power, unit: W}
  connected: {key: plugged, on_states: ["on"]}
  charged_energy: {key: session_energy, unit: Wh, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}

charge_control:
  charge:
    - modbus: {address: 256, scale: 100, value: "{{ power_w }}", write: if_differs, tolerance: 100}
  stop:
    - modbus: {address: 256, scale: 100, value: 0, write: if_differs}
  release:
    - modbus: {address: 256, scale: 100, value: "{{ max_power }}", write: if_differs}
