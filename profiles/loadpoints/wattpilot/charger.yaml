# Fronius Wattpilot via the wattpilot custom integration (HACS, mk-maddin; local websocket).
# The entities follow the go-e API v2: unique ids look like "<name>-<key>". The current is the
# requested current "amp", kept by the charger like on the go-e: changed at most every
# 3 minutes and restored when Sunflow lets go. Charging is forced with "frc" (disabled by
# default in Home Assistant, Sunflow enables it). A failed write is only logged by the
# integration: Sunflow reads the state back.
# Not verified on hardware yet.
profile: wattpilot/charger
version: 1
match:
  integration: wattpilot
  requires: [amp, frc]

capabilities: [loadpoint]

roles:
  charge_power: {key: nrg, unit: W}
  connected: {key: car, domain: sensor, on_states: ["Charging", "Wait Car", "Complete"]}
  charged_energy: {key: wh, unit: Wh, optional: true}
  stored_current: {key: amp, domain: number, unit: A, optional: true}
  phase_mode: {key: psm, optional: true}
  vehicle_soc: {key: vehicle_soc, unit: "%", optional: true}

parameters:
  max_power: {unit: W, default: 11000, min: 0}
  vehicle_capacity_wh: {unit: Wh, min: 0}
  charge_efficiency_pct: {unit: "%", default: 90, min: 50, max: 100}
  phases: {unit: "", default: 3, min: 1, max: 3, advanced: true}
  phase_mode: {unit: "", default: 0, min: 0, max: 3}
  phase_up_w: {unit: W, default: 4500, min: 1500, max: 22000}
  phase_down_w: {unit: W, default: 4000, min: 1000, max: 22000}
  phase_up_delay_min: {unit: min, default: 5, min: 1, max: 60, advanced: true}
  phase_down_delay_min: {unit: min, default: 2, min: 1, max: 60, advanced: true}
  phase_min_interval_min: {unit: min, default: 15, min: 5, max: 240, advanced: true}
  phase_max_switches_day: {unit: "", default: 12, min: 1, max: 100, advanced: true}
  min_current_a: {unit: A, default: 6, min: 6, max: 32}
  max_current_a: {unit: A, default: 16, min: 6, max: 32}
  current_interval_min: {unit: min, default: 3, min: 1, max: 60, advanced: true}

charge_control:
  charge:
    - number: {key: amp, value: "{{ current_a }}", write: if_differs}
    - select: {key: frc, option: "Forced on", write: if_differs}
  stop:
    - select: {key: frc, option: "Stopped", write: if_differs}
  release:
    - select: {key: frc, option: "Neutral", write: if_differs}
  remember: {key: amp, domain: number}

phase_switch:
  remember: {key: psm}
  one:
    - select: {key: psm, option: "1 Phase", storage: eeprom, write: if_differs}
  three:
    - select: {key: psm, option: "3 Phases", storage: eeprom, write: if_differs}

eeprom_guard:
  max_writes_per_day: 20
