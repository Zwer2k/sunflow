# Any switchable consumer (Shelly, ESPHome, smart plug, input_boolean ...), added
# manually in the setup wizard. Roles are bound to entities chosen by the user.
profile: generic/switch
version: 1
match:
  integration: manual

capabilities: [load]

roles:
  switch: {key: manual_switch}
  power: {key: manual_power, unit: W, optional: true}

parameters:
  max_power: {unit: W, default: 500, min: 0}
  daily_energy_wh: {unit: Wh, min: 0}
