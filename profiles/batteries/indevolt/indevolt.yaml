# Indevolt storage (SolidFlex/PowerFlex, AC-coupled with own MPPT inputs) via the core
# indevolt integration (local HTTP API). Unique ids are "<serial>_<key>"; sensor keys are the
# device's data point numbers.
# Charging and discharging at a set power are the integration's actions; they switch the
# device to real-time control. Self-consumption mode follows the device's own meter.
# Battery power sign: assumed + = discharge, like the AC output. Not verified on hardware yet;
# tested against tools/sim/indevolt.py.
profile: indevolt/indevolt
version: 1
match:
  integration: indevolt
  requires: ["6002", "6000", energy_mode]

capabilities: [pv, battery, battery_control]
# On the house's AC side: PV from the roof is converted to AC and back when stored
coupling: ac
watchdog: none
fallback: auto

roles:
  battery_soc: {key: "6002", unit: "%"}
  battery_power: {key: "6000", unit: W, sign: discharge_positive}
  pv_power: {key: "1501", unit: W}
  pv1_power: {key: "1664", unit: W, optional: true}
  pv2_power: {key: "1665", unit: W, optional: true}
  # AC output to the house; AC input is grid charging
  inverter_power: {key: "2108", unit: W, optional: true}
  pv_energy: {key: "1505", unit: Wh, optional: true}
  battery_charge_energy: {key: "6006", unit: kWh, optional: true}
  battery_discharge_energy: {key: "6007", unit: kWh, optional: true}

parameters:
  capacity_wh: {unit: Wh, min: 500, derive: {sum_key: "142", factor: 1000}}
  # The API refuses targets below 5 %
  min_soc: {unit: "%", default: 10, min: 5, max: 100}
  max_charge: {unit: W, default: 2400, min: 0}
  # Plug-in operation is usually limited to 800 W
  max_discharge: {unit: W, default: 800, min: 0}
  efficiency_pct: {unit: "%", default: 92, min: 40, max: 100}
  inverter_efficiency_pct: {unit: "%", default: 95, min: 80, max: 100}

battery_control:
  auto:
    - select: {key: energy_mode, option: self_consumed_prioritized, storage: eeprom, write: if_differs}
    - number: {key: max_ac_output_power, value: "{{ max_discharge }}", storage: eeprom, write: if_differs, tolerance: 50}
  # Self-consumption still charges from PV; only the AC output is capped
  hold:
    - select: {key: energy_mode, option: self_consumed_prioritized, storage: eeprom, write: if_differs}
    - number: {key: max_ac_output_power, value: 0, storage: eeprom, write: if_differs}
  limit_discharge:
    - select: {key: energy_mode, option: self_consumed_prioritized, storage: eeprom, write: if_differs}
    - number: {key: max_ac_output_power, value: "{{ P }}", min: 0, storage: eeprom, write: if_differs, tolerance: 50}
  force_charge:
    - service: {action: indevolt.charge, data: {device_id: "{{ device_id }}", power: "{{ P }}", target_soc: 100}}
  force_discharge:
    - service: {action: indevolt.discharge, data: {device_id: "{{ device_id }}", power: "{{ P }}", target_soc: "{{ min_soc }}"}}
  refresh: 10min

eeprom_guard:
  max_writes_per_day: 30
